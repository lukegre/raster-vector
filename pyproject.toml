[project]
name = "raster-vector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukegre", email = "lukegre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.1",
    "joblib>=1.5.2",
    "loguru>=0.7.3",
    "numpy>=2.3.4",
    "rasterio>=1.4.3",
    "rioxarray>=0.20.0",
    "shapely>=2.1.2",
    "xarray>=2025.10.1",
]

[project.scripts]
raster-vector = "raster_vector:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
