[project]
name = "raster-vector"
version = "0.1.0"
description = "Bidirectional conversion between raster (xarray) and vector (GeoDataFrame) formats."
readme = "README.md"
authors = [
    { name = "lukegre", email = "lukegre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.1",
    "joblib>=1.5.2",
    "loguru>=0.7.3",
    "numpy>=2.2",
    "rasterio>=1.4.3",
    "rioxarray>=0.20.0",
    "shapely>=2.1.2",
    "xarray>=2025.10.1",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.13.2",
    "fsspec>=2025.10.0",
    "folium>=0.20.0",
    "h5netcdf>=1.7.3",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.7",
    "prek>=0.3.4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B006",  # mutable default args — common in geospatial code
    "SIM108", # ternary operator — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["raster_vector"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
